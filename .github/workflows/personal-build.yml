name: Latest Personal

on:
  push:
    branches: [personal-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-personal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: bash ci/build.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Latest-Personal-arm64
          path: dist/Latest-Personal-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/*.xcresult
          retention-days: 14
